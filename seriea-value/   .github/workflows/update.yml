name: Aggiorna schedina

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "aggiorna"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica i dati e genera il sito
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python fetch.py || true
          python analyze.py

      - name: Salva la cache dei dati
        if: always()
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@github.com"
          git add data/ site/ || true
          git commit -m "aggiornamento dati $(date -u +%F)" || echo "niente da salvare"
          git push || echo "niente da pushare"

      - name: Prepara la pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pubblica il sito
        id: deploy
        uses: actions/deploy-pages@v4
